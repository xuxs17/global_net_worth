name: Update Exchange Rates

on:
  schedule:
    - cron: '15 0 * * *'  # daily at 00:15 UTC
  workflow_dispatch:       # manual trigger

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch latest rates
        run: python scripts/update_rates.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/rates.json
          if git diff --cached --quiet; then
            echo "No changes to rates."
          else
            git commit -m "chore: update exchange rates [skip ci]"
            git push
            echo "Rates updated and pushed."
          fi
